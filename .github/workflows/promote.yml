name: Promote to main

on:
  push:
    branches: [main]

# Allow only one promotion to run at a time; do not cancel in progress.
concurrency:
  group: promote-to-main
  cancel-in-progress: false

permissions:
  contents: write  # wiki-update job pushes to the wiki repo
  issues: write    # bug-tracker creates issues on test failures
  pages: write     # deploy job uploads to GitHub Pages
  id-token: write  # deploy job authenticates with OIDC

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        id: unit-tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Create issue on failure
        if: steps.unit-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: Unit tests failing on main" \
            --body "Unit tests failed in the promotion pipeline [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\`." \
            --source "ci-unit-tests"

      - name: Fail if tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e-tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: steps.e2e-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: playwright-report/
          retention-days: 7

      - name: Create issue on failure
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: E2E tests failing on main" \
            --body "E2E tests failed in the promotion pipeline [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\`. Playwright report uploaded as a build artifact." \
            --source "ci-e2e-tests"

      - name: Fail if tests failed
        if: steps.e2e-tests.outcome == 'failure'
        run: exit 1

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [unit-tests, e2e-tests, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  wiki-update:
    name: Update wiki
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Clone wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Review and update wiki
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-wiki.mjs

      - name: Push wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Wiki: reflect $(cd .. && git log -1 --format='%s' | cut -c1-72)"
            git push
            echo "Wiki updated."
          else
            echo "No wiki changes needed."
          fi
