name: Promote to main

on:
  push:
    branches: [main]

# Allow only one promotion to run at a time; do not cancel in progress.
concurrency:
  group: promote-to-main
  cancel-in-progress: false

permissions:
  contents: write  # deploy job pushes to gh-pages branch
  issues: write    # bug-tracker creates issues on test failures

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        id: unit-tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Create issue on failure
        if: steps.unit-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: Unit tests failing on main" \
            --body "Unit tests failed in the promotion pipeline [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\`." \
            --source "ci-unit-tests"

      - name: Fail if tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e-tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: steps.e2e-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-main
          path: playwright-report/
          retention-days: 7

      - name: Create issue on failure
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: E2E tests failing on main" \
            --body "E2E tests failed in the promotion pipeline [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\`. Playwright report uploaded as a build artifact." \
            --source "ci-e2e-tests"

      - name: Fail if tests failed
        if: steps.e2e-tests.outcome == 'failure'
        run: exit 1

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

  deploy:
    name: Deploy to GitHub Pages
    needs: [unit-tests, e2e-tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

      # keep_files: true preserves the preview/ subdirectories written by branch CI.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          commit_message: "deploy: main @ ${{ github.sha }}"
