name: Clean up preview

on:
  # When a PR closes (merged or abandoned), remove its preview.
  pull_request:
    types: [closed]
  # When a branch is deleted directly, remove its preview.
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove preview deployment
    # For delete events, only act on branch deletions (not tag deletions).
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview path
        id: preview
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.event.ref }}"
          fi
          SAFE=$(echo "$BRANCH" | tr '/\\' '-' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "safe=$SAFE" >> $GITHUB_OUTPUT
          echo "path=preview/${SAFE}" >> $GITHUB_OUTPUT

      - name: Check if gh-pages branch exists
        id: check
        run: |
          if git ls-remote --exit-code \
               "https://github.com/${{ github.repository }}.git" gh-pages \
               > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.exists == 'true'
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Remove preview directory
        if: steps.check.outputs.exists == 'true'
        run: |
          PREVIEW_DIR="${{ steps.preview.outputs.path }}"
          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: remove preview/${{ steps.preview.outputs.safe }}"
            git push
            echo "Preview removed."
          else
            echo "No preview at $PREVIEW_DIR — nothing to remove."
          fi
