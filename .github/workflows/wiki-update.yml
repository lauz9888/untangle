name: Update wiki

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-wiki:
    name: Review and update wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clone wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Review and update wiki
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-wiki.mjs

      - name: Push wiki changes
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Wiki: reflect $(cd .. && git log -1 --format='%s' | cut -c1-72)"
            git push
            echo "Wiki updated."
          else
            echo "No wiki changes needed."
          fi
