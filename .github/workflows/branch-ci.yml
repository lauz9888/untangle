name: Branch CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write       # deploy-preview pushes to gh-pages
  issues: write         # bug-tracker creates issues on test failures
  pull-requests: write  # deploy-preview posts the preview URL as a PR comment

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

  deploy-preview:
    name: Deploy preview
    needs: build-check
    # Skip for PRs from forks — GITHUB_TOKEN cannot write to the base repo in that case.
    if: >-
      ${{ github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview path
        id: preview
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          SAFE=$(echo "$BRANCH" | tr '/\\' '-' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "safe=$SAFE" >> $GITHUB_OUTPUT
          echo "path=preview/${SAFE}" >> $GITHUB_OUTPUT
          echo "url=https://lauz9888.github.io/untangle/preview/${SAFE}/" >> $GITHUB_OUTPUT

      # Check out the actual branch HEAD rather than the PR merge commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for preview
        run: npm run build
        env:
          VITE_BASE: /untangle/${{ steps.preview.outputs.path }}/
          GITHUB_ACTIONS: true

      - name: Deploy to gh-pages preview path
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.preview.outputs.path }}
          keep_files: true
          commit_message: "preview: ${{ steps.preview.outputs.safe }} @ ${{ github.sha }}"

      - name: Post preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.preview.outputs.url }}"
          BODY="**Preview:** [${URL}](${URL}) — built from \`${{ github.sha }}\`"
          gh pr comment ${{ github.event.pull_request.number }} \
            --edit-last --body "$BODY" 2>/dev/null || \
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY"

  unit-tests:
    name: Unit tests
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        id: unit-tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Create issue on failure
        if: steps.unit-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: Unit tests failing on ${{ github.ref_name }}" \
            --body "Unit tests failed in CI run [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)." \
            --source "ci-unit-tests"

      - name: Fail if tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

  e2e-tests:
    name: E2E tests
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e-tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright report
        if: steps.e2e-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Create issue on failure
        if: steps.e2e-tests.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/bug-tracker.mjs create \
            --title "Bug: E2E tests failing on ${{ github.ref_name }}" \
            --body "E2E tests failed in CI run [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) on commit \`${{ github.sha }}\` (\`${{ github.ref_name }}\`). Playwright report uploaded as a build artifact." \
            --source "ci-e2e-tests"

      - name: Fail if tests failed
        if: steps.e2e-tests.outcome == 'failure'
        run: exit 1
